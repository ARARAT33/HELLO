<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLO — Generated Page</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050816;color:#eef2ff;font-family:system-ui,sans-serif}main{width:min(1250px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.btn{padding:11px 15px;border:1px solid #ffffff22;border-radius:12px;background:#ffffff0b;color:inherit;cursor:pointer}.hero{margin-top:16px;border:1px solid #ffffff18;border-radius:24px;overflow:hidden;background:#0b1022}.visual{height:55vh;min-height:320px}.visual canvas{width:100%;height:100%;display:block}.pad{padding:22px}.eyebrow{color:#8fa2d4;font-size:13px}.title{font-size:clamp(30px,6vw,72px);line-height:1;margin:8px 0 14px}.desc{color:#aab6d2;max-width:800px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}.card{padding:16px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08}.card b{display:block;margin-bottom:7px}.mono{font:12px ui-monospace,monospace;color:#8997b9;word-break:break-all}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:99px;background:#ffffff0b;border:1px solid #ffffff18;font-size:12px}.footer{color:#667395;text-align:center;margin-top:28px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bar button{flex:1;min-width:120px}
</style></head><body><main><div class="top"><button class="btn" onclick="location.href='index.html'">← HELLO</button><div class="chips"><span class="chip">RUNTIME</span><span class="chip">NO STORAGE</span><span class="chip">DETERMINISTIC</span></div></div><section class="hero"><div class="visual"><canvas id="c"></canvas></div><div class="pad"><div class="eyebrow" id="ey"></div><h1 class="title" id="title"></h1><p class="desc" id="desc"></p><div class="bar"><button class="btn" onclick="randomize()">🎲 Random page</button><button class="btn" onclick="copyId()">📋 Copy identity</button><button class="btn" onclick="location.href='index.html'">✦ Generate another</button></div></div></section><section class="grid" id="cards"></section><div class="footer">Every visible property is calculated in the browser from the input + mathematical generators.</div></main><script>
const $=s=>document.querySelector(s);const topics=['cosmos','science','ai','nature','history','fantasy','technology','art','architecture','music','mathematics','physics','chemistry','biology','medicine','ocean','space','geology','climate','animals','plants','cities','travel','food','literature','language','philosophy','psychology','economics','business','education','games','cinema','photography','fashion','design','engineering','robotics','cybersecurity','networks','programming','algorithms','cryptography','astronomy','mythology','archaeology','geography','sports','cars','aviation','railways','oceans','weather','energy','materials','electronics','architecture','sculpture','painting','poetry','theatre','dance','history','future','dreams','abstract','minimal','brutalism','cyberpunk','solarpunk','steampunk','surreal','retro','neon','organic','fractal','geometry','typography','data','logic','numbers','time','memory','sound','light','color','motion','gravity','particles','waves','cells','atoms','molecules','stars','galaxies','planets','forests','deserts','mountains','rivers','islands','villages','megacities','libraries','archives','inventions','machines','spacecraft','microbiology','quantum','relativity','statistics','coding','open-world','experimental','unknown'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rng(seed){let x=seed>>>0;return()=>{x=Math.imul(x+0x6D2B79F5,1|x);let t=x^x>>>15;t=Math.imul(t,1|x);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}function get(){let raw=decodeURIComponent(location.hash.slice(1)||'∞');return raw.normalize('NFC')}let input=get();let seed=hash32(input);let r=rng(seed);let topic=topics[seed%topics.length];let accents=Array.from({length:5},()=>`hsl(${Math.floor(r()*360)} 80% ${45+Math.floor(r()*25)}%)`);let algorithms=128;let layouts=['radial','spiral','orbit','grid','wave','fracture','rings','constellation','flow','stack','mosaic','cascade','mirror','polar','noise','fractal','cellular','voronoi','lattice','web'];let layout=layouts[Math.floor(r()*layouts.length)];let title=input==='∞'?'Infinite '+topic:input+' — '+topic;$('#ey').textContent='GENERATED PAGE · '+topic.toUpperCase()+' · '+layout.toUpperCase();$('#title').textContent=title;$('#desc').textContent='Այս էջը պահված ֆայլ չէ․ այն այս պահին հաշվարկվում է runtime-ում։ Input-ը նույնը պահելու դեպքում նույն canonical universe-ն է ստացվում, իսկ այլ input-ը փոխում է seed-ը և էջի կառուցվածքը։';
let c=$('#c'),ctx=c.getContext('2d'),W,H,pts=[];function resize(){W=c.clientWidth*devicePixelRatio;H=c.clientHeight*devicePixelRatio;c.width=W;c.height=H;pts=[];for(let i=0;i<180;i++)pts.push({x:r()*W,y:r()*H,z:r(),s:.5+r()*3,a:r()*Math.PI*2})}function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,accents[0]);g.addColorStop(1,'#02030a');ctx.globalAlpha=.2;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;let t=performance.now()/5000;for(const p of pts){let x=p.x+Math.sin(t+p.a)*W*.03,y=p.y+Math.cos(t+p.a)*H*.03;ctx.beginPath();ctx.arc(x,y,p.s,0,7);ctx.fillStyle=accents[Math.floor(p.z*accents.length)];ctx.globalAlpha=.35+p.z*.6;ctx.fill()}ctx.globalAlpha=.28;ctx.strokeStyle=accents[1];for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(W*.5,H*.5,(.15+k*.09)*W,(.08+k*.055)*H,t+k,0,Math.PI*2);ctx.stroke()}requestAnimationFrame(draw)}
let cards=[];for(let i=0;i<algorithms;i++){let kind=layouts[Math.floor(r()*layouts.length)];let complexity=1+Math.floor(r()*999999);cards.push(`<article class="card"><b>Generator ${String(i+1).padStart(3,'0')} · ${kind}</b><div class="mono">parameter=${complexity} · phase=${Math.floor(r()*360)}° · seed=${(seed>>>0).toString(16)}</div><p>Այս ներքին մաթեմատիկական generator-ը որոշում է էջի դիրքերը, չափերը, հարաբերությունները և տեսողական պատահականությունը։</p></article>`)}$('#cards').innerHTML=cards.join('');addEventListener('resize',resize);resize();draw();function copyId(){navigator.clipboard?.writeText(location.href)}function randomize(){location.hash=encodeURIComponent(Math.random().toString(36).slice(2)+'-'+Date.now());location.reload()}
</script></body></html>
