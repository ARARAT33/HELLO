<!doctype html>
<html lang="hy"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLO Infinite Generator</title><style>
body{margin:0;font-family:system-ui;background:#0b1020;color:white}header{padding:30px;text-align:center;background:linear-gradient(135deg,#2563eb,#9333ea)}main{max-width:1000px;margin:auto;padding:25px}.box{background:#111827;padding:20px;border-radius:20px;margin:15px 0}input,select,button{padding:12px;border-radius:10px;border:0;margin:5px}button{cursor:pointer;background:#22c55e;color:white;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#1f2937;padding:20px;border-radius:15px;min-height:100px}</style></head>
<body><header><h1>∞ HELLO Universe Generator</h1><p>Անվերջ ալգորիթմական եզակի էջեր</p></header><main><div class="box"><h2>Ստեղծիր նոր էջ</h2><select id="topic"><option>Գիտություն</option><option>Տիեզերք</option><option>AI</option><option>Ֆանտազիա</option><option>Ծրագրավորում</option><option>Պատմություն</option></select><input id="seed" placeholder="0 - անվերջ թիվ կամ նշան"><button onclick="generate()">Generate</button></div><div id="page" class="box"></div></main><script>
function hash(s){let h=2166136261;for(let c of s)h=(h^c.charCodeAt(0))*16777619;return Math.abs(h)}
function generate(){let t=document.getElementById('topic').value,s=document.getElementById('seed').value||Math.random();let h=hash(t+s),words=['Quantum','Nova','AWE','Matrix','Future','Origin','Infinity','Echo'];let title=words[h%words.length]+' '+(h%1000000);let alg=[];for(let i=0;i<100;i++)alg.push((h*(i+1)*31%999999));document.getElementById('page').innerHTML=`<h2>${title}</h2><p>Թեմա: ${t}</p><p>Seed: ${s}</p><div class="grid">${alg.slice(0,12).map((x,i)=>`<div class="card"><b>Algorithm ${i+1}</b><br>${x}</div>`).join('')}</div><p>Այս էջը ստեղծվել է deterministic generator-ով և նույն seed-ը տալիս է նույն արդյունքը։</p>`}
generate();</script></body></html>
