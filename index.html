<!doctype html><html lang="hy"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLO Infinite Universe v3</title><style>body{margin:0;background:#020617;color:white;font-family:system-ui}header{padding:35px;text-align:center;background:linear-gradient(135deg,#2563eb,#9333ea)}main{padding:20px;max-width:1200px;margin:auto}.box{background:#111827dd;padding:20px;border-radius:25px;margin:15px 0}button,input,select{padding:14px;border-radius:12px;border:0;margin:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#1e293b;padding:18px;border-radius:18px}.art{height:280px;border-radius:25px;background:conic-gradient(from 0deg,#2563eb,#9333ea,#22c55e,#2563eb);animation:spin 12s linear infinite}@keyframes spin{to{filter:hue-rotate(360deg)}}video{width:100%;height:200px;background:#000;border-radius:20px}</style></head><body><header><h1>∞ HELLO Infinite Universe v3</h1><p>Real-time procedural page engine</p></header><main><div class="box"><input id="seed" placeholder="ցանկացած լեզու, նիշ, emoji"><select id="topic"><option>AI</option><option>Space</option><option>Science</option><option>Fantasy</option><option>History</option></select><button onclick="gen()">CREATE</button></div><div id="out" class="box"></div></main><script>function hash(s){let h=BigInt(1469598103934665603);for(let c of s){h^=BigInt(c.codePointAt(0));h*=1099511628211n;h&=18446744073709551615n}return h}function gen(){let s=document.getElementById('seed').value||'∞',t=document.getElementById('topic').value,h=hash(t+'|'+s),id=h.toString(16);let cards='';for(let i=0;i<50;i++){h=(h*6364136223846793005n+1442695040888963407n)&18446744073709551615n;cards+=`<div class="card">Algorithm ${i}<br>${h.toString(16)}</div>`}document.getElementById('out').innerHTML=`<div class="art"></div><h2>Universe ${id}</h2><p>${t} / ${s}</p><canvas id="c"></canvas><video autoplay muted loop><source src="" ></video><div class="grid">${cards}</div><button onclick="navigator.clipboard.writeText(id)">Share</button>`}gen()</script></body></html>
